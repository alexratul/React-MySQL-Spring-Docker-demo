
services:
  mysql:
    build: ../04-database/database/
    container_name: mysql_container
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      # If you want to expose the container to the host put hostport:container port
      # Otherwise only expose the container to other containers
      - "3306:3306"
    volumes:
      # The path on the host machine where ther database files are going to be stored!!
      - database-volume-02-backend:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 3s
      retries: 20
      timeout: 5s
      start_period: 5m


volumes:
  database-volume-02-backend:
    driver: local 